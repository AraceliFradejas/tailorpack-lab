[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailorpack"
version = "0.1.0"
description = "Reproducible square packing experiments; not the Kaggle evaluator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tailorpack = "tailorpack.__main__:main"

[tool.setuptools.packages.find]
include = ["tailorpack*"]
